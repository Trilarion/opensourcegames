[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "osgl-maintenance"
version = "0.1.0"
description = "Maintenance scripts for the Open Source Games List (OSGL)"
requires-python = ">=3.12"
# dependencies are unpinned to allow flexible version updates
dependencies = [
    "pygithub",
    "python-gitlab",
    "lark-parser",
    "BeautifulSoup4",
    "PySide6",
    "wikipedia",
    "Jinja2",
    "html5lib",
    "ruamel.yaml",
    "requests",
    "numpy",
    "pillow",
    "matplotlib",
]

# The scripts are run directly from this folder and are not an installable package;
# installing this project only installs the dependencies.
[tool.setuptools]
py-modules = []
packages = []
